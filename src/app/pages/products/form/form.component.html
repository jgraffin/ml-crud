<h1
  class="text-size-small font-bold flex w-full mb-2 border-b border-b-gray-200 pb-4 items-center gap-4"
>
  <button
    (click)="closeForm()"
    mat-icon-button
    aria-label="close"
    class="flex items-center"
  >
    <mat-icon class="text-size-medium">chevron_left</mat-icon>
  </button>

  {{ formData.get("id") ? "Alterar Produto" : "Adicionar Produto" }}
</h1>

<form [formGroup]="formData">
  <div class="flex flex-wrap flex-col w-full">
    <div class="flex gap-3 w-full">
      <mat-form-field class="w-1/2" appearance="outline" floatLabel="always">
        <mat-label>Nome do Produto</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field class="w-1/2" appearance="outline" floatLabel="always">
        <mat-label>Preço</mat-label>
        <input
          matInput
          formControlName="price"
          [currencyMask]="{
            prefix: 'R$ ',
            thousands: '.',
            decimal: ',',
            align: 'left'
          }"
        />
      </mat-form-field>
    </div>

    <div class="flex gap-3 w-full">
      <mat-form-field class="w-1/2" appearance="outline" floatLabel="always">
        <mat-label>Cor</mat-label>
        <mat-select formControlName="color">
          <mat-option value="Midnight">Midnight</mat-option>
          <mat-option value="Starlight">Starlight</mat-option>
          <mat-option value="Space Grey">Space Grey</mat-option>
          <mat-option value="Silver">Silver</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="w-1/2" appearance="outline" floatLabel="always">
        <mat-label>Quantidade</mat-label>
        <input matInput formControlName="quantity" type="number" />
      </mat-form-field>
    </div>

    <div class="flex gap-3 w-full">
      <mat-form-field class="w-full" appearance="outline" floatLabel="always">
        <mat-label>Descrição</mat-label>
        <textarea
          matInput
          cdkTextareaAutosize
          #autosize="cdkTextareaAutosize"
          cdkAutosizeMinRows="1"
          cdkAutosizeMaxRows="5"
          formControlName="description"
        ></textarea>
      </mat-form-field>
    </div>

    <h3
      class="text-size-tiny font-bold flex w-full border-b border-b-gray-200 pb-2 items-center gap-4 mb-6"
    >
      Características
    </h3>

    <div class="flex gap-3 w-full" formGroupName="characteristics">
      <mat-form-field class="w-1/2" appearance="outline" floatLabel="always">
        <mat-label>Memória</mat-label>
        <mat-select formControlName="memory">
          <mat-option value="8GB">8GB</mat-option>
          <mat-option value="16GB">16GB</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field class="w-1/2" appearance="outline" floatLabel="always">
        <mat-label>Tamanho da Tela</mat-label>
        <mat-select formControlName="screen">
          <mat-option value='13.3"'>13.3</mat-option>
          <mat-option value='13.5"'>15.5</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="flex gap-3 w-full" formGroupName="characteristics">
      <mat-form-field class="w-1/3" appearance="outline" floatLabel="always">
        <mat-label>Duração da Bateria</mat-label>
        <mat-select formControlName="batteryDuration">
          <mat-option value="3 h">3h</mat-option>
          <mat-option value="10 h">10h</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field class="w-1/3" appearance="outline" floatLabel="always">
        <mat-label>Resolução</mat-label>
        <mat-select formControlName="resolution">
          <mat-option value="Full HD">Full HD</mat-option>
          <mat-option value="Ultra Full HD">Ultra Full HD</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field class="w-1/3" appearance="outline" floatLabel="always">
        <mat-label>Tela Touch</mat-label>
        <mat-select formControlName="touchableScreen">
          <mat-option value="true">Yes</mat-option>
          <mat-option value="false">No</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
  <div class="flex gap-3 w-full justify-end">
    <button
      mat-stroked-button
      class="border bg-highlight-2 rounded-lg px-4 py-2"
      [disabled]="!formData.valid"
      (click)="closeForm()"
    >
      Cancelar
    </button>
    <button
      mat-stroked-button
      class="bg-success text-white rounded-lg px-4 py-2"
      [disabled]="!formData.valid"
      (click)="submitForm()"
    >
      {{ formData.get("id") ? "Atualizar" : "Salvar Produto" }}
    </button>
  </div>
</form>
