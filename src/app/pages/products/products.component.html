<h1
  class="text-size-small font-bold flex w-full mb-2 border-b border-b-gray-200 pb-4"
>
  List All Macs
</h1>

<button
  mat-stroked-button
  class="bg-success text-white rounded-lg px-4 py-2 max-w-fit"
  (click)="createProduct()"
>
  Novo Produto
</button>

<div class="flex rounded-lg overflow-hidden">
  <app-table
    [data]="products$"
    [displayedColumns]="displayedColumns"
    (handleEdit)="editProduct($event)"
    (handleDelete)="deleteProduct($event)"
  ></app-table>
</div>
